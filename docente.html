<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MARCAQR DOCENTE</title>

  <link rel="icon" type="image/png" href="./icono-marcaqr-192.png">

  <style>
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#f3f6f8;
      text-align:center;
      color:#17365D;
    }

    .contenedor{
      max-width:430px;
      margin:30px auto;
      padding:22px;
      box-sizing:border-box;
    }

    .logo{
      width:170px;
      height:auto;
      display:block;
      margin:10px auto 10px auto;
    }

    .marca{
      font-size:32px;
      font-weight:800;
      margin:0;
    }

    .marca span{
      color:#32b64a;
    }

    .slogan{
      font-size:11px;
      font-weight:bold;
      letter-spacing:.5px;
      margin:8px 0 25px 0;
    }

    .card{
      background:white;
      padding:25px 20px;
      border-radius:18px;
      box-shadow:0 4px 18px rgba(0,0,0,.10);
    }

    h2{
      margin-top:0;
    }

    input{
      width:100%;
      box-sizing:border-box;
      padding:15px;
      margin:8px 0;
      border:1px solid #ccc;
      border-radius:10px;
      font-size:17px;
      text-align:center;
    }

    button{
      width:100%;
      box-sizing:border-box;
      padding:16px;
      margin-top:12px;
      border:0;
      border-radius:11px;
      color:white;
      font-size:17px;
      font-weight:bold;
      cursor:pointer;
    }

    .entrada{
      background:#2e7d32;
    }

    .salida{
      background:#17365D;
    }

    #mensaje{
      margin-top:18px;
      font-size:16px;
      font-weight:bold;
      color:#333;
    }

    @media (max-width:600px){
      .contenedor{
        width:100%;
        max-width:none;
        padding:14px;
      }

      .logo{
        width:150px;
      }

      .card{
        padding:25px 18px;
      }
    }
  </style>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body>

<div class="contenedor">

  <img src="./icono-marcaqr.png"
       class="logo"
       alt="MARCAQR">

  <div class="marca">
    MARCA<span>QR</span>
  </div>

  <div class="slogan">
    ASISTENCIA • CONTROL • CONFIANZA
  </div>

 <div class="card">

  <h2>MARCAQR DOCENTE</h2>

  <p>Escanea el QR de tu institución para registrar tu asistencia.</p>

  <button
    class="entrada"
    onclick="iniciarEscaner()">
    📷 ESCANEAR QR
  </button>

  <div
    id="lectorQR"
    style="width:100%; margin-top:20px; display:none;">
  </div>

  <div id="mensaje" style="margin-top:15px;"></div>

</div>

</div>

<script>

let escanerQR = null;

function iniciarEscaner() {

  const lector = document.getElementById("lectorQR");
  const mensaje = document.getElementById("mensaje");

  lector.style.display = "block";
  mensaje.innerHTML = "📷 Apunta la cámara al QR de la institución.";

  escanerQR = new Html5Qrcode("lectorQR");

  escanerQR.start(
    { facingMode: "environment" },
    {
      fps: 10,
      qrbox: 250
    },
    function(textoQR) {

      mensaje.innerHTML = "✅ QR detectado. Abriendo MARCAQR...";

      escanerQR.stop().then(function() {

        if (textoQR.startsWith("https://")) {
          window.location.href = textoQR;
        } else {
          mensaje.innerHTML = "❌ QR no válido.";
        }

      });

    },
    function(error) {
      // Sigue buscando el QR
    }
  ).catch(function(error) {
    mensaje.innerHTML =
      "❌ No se pudo abrir la cámara. Permite el acceso a la cámara.";
  });
}
</script>

</body>
</html>
