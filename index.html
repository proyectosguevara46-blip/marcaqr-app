<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MARCAQR ADMIN</title>

<link rel="manifest" href="./manifest.json">

<meta name="theme-color" content="#17365D">

<link rel="icon" type="image/png" sizes="192x192"
      href="./icono-marcaqr-192.png">

<link rel="apple-touch-icon"
      href="./icono-marcaqr-192.png">
<style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6f8;
      text-align: center;
    }

    .contenedor {
      max-width: 420px;
      margin: 60px auto;
      padding: 30px;
    }

    .logo {
      width: 180px;
      border-radius: 25px;
    }

    h1 {
      color: #17365D;
      margin-bottom: 5px;
    }

    p {
      color: #555;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #17365D;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
  .cajaAdmin {
  background:white;
  padding:15px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  text-align:center;
}

.cajaAdmin b {
  font-size:26px;
  color:#17365D;
}

table th,
table td {
  padding:10px;
  border:1px solid #ddd;
}

table td:first-child {
  font-weight:bold;
}    
/* DISEÑO PARA COMPUTADORA */
@media (min-width: 800px) {

  .contenedor {
    max-width: 1100px;
    width: 92%;
  }
.logo {
  width: 150px;
  height: auto;
  display: block;
  margin: 20px auto 15px auto;
}

body {
  padding-top: 20px;
}
  #panelAdmin {
    width: 100%;
  }

  #panelAdmin > div:first-of-type {
    grid-template-columns: repeat(5, 1fr) !important;
  }

  .cajaAdmin {
    padding: 20px 10px;
  }

  .cajaAdmin b {
    font-size: 30px;
  }

  #panelAdmin table {
    font-size: 15px !important;
  }

  #panelAdmin th,
  #panelAdmin td {
    padding: 12px;
  }
}  
.cabeceraAdmin {
  display:grid;
  grid-template-columns:240px 1fr 240px;
  gap:20px;
  align-items:center;
  background:white;
  padding:22px;
  border-radius:20px;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
  margin-bottom:22px;
}

.marcaBloque,
.institucionBloque {
  text-align:center;
}

.logoMarcaAdmin,
.logoInstitucion {
  width:150px;
  max-height:150px;
  object-fit:contain;
}

.marcaTexto {
  font-size:34px;
  font-weight:800;
  color:#17365D;
  margin-top:8px;
}

.marcaTexto span {
  color:#2eaa45;
}

.marcaSlogan {
  font-size:11px;
  font-weight:bold;
  color:#17365D;
  margin-top:4px;
}

.institucionNombre {
  font-size:28px;
  font-weight:800;
  color:#17365D;
  margin-top:8px;
}

.institucionSub {
  font-size:14px;
  font-weight:bold;
  color:#17365D;
  margin-top:3px;
}

.resumenSuperior {
  display:grid;
  grid-template-columns:repeat(5, 1fr);
  gap:12px;
}

.kpi {
  background:white;
  padding:14px 8px;
  border-radius:14px;
  text-align:center;
  box-shadow:0 3px 10px rgba(0,0,0,.10);
  border-bottom:4px solid #17365D;
}

.kpiIcono {
  font-size:26px;
}

.kpiNumero {
  font-size:34px;
  font-weight:800;
  margin-top:4px;
}

.kpiTexto {
  font-size:14px;
  margin-top:2px;
}

.kpiAzul { border-bottom-color:#1e73ea; }
.kpiVerde { border-bottom-color:#2eaa45; }
.kpiNaranja { border-bottom-color:#f28c18; }
.kpiRojo { border-bottom-color:#e3222e; }
.kpiMorado { border-bottom-color:#7646e7; }

.datosRapidos {
  grid-column:1 / -1;
  display:flex;
  justify-content:center;
  gap:30px;
  flex-wrap:wrap;
  margin-top:8px;
  font-size:14px;
  color:#17365D;
  font-weight:bold;
}

.tituloPanel {
  text-align:center;
  margin:15px 0 20px 0;
}

.tituloPanel h2 {
  color:#17365D;
  margin-bottom:4px;
}

.tituloPanel p {
  margin-top:0;
}
.accionesAdmin {
  display:grid;
  grid-template-columns:
    1.1fr 1.35fr 1fr 0.9fr 1.15fr 1.25fr 1.5fr;
  gap:10px;
  align-items:center;
  margin:18px 0;
}

.btnAdmin {
  width:100%;
  border:none;
  border-radius:10px;
  padding:14px 10px;
  color:white;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
  box-sizing:border-box;
}

.btnAzul {
  background:#0d3f7a;
}

.btnVerde {
  background:#159b35;
}

.btnNaranja {
  background:#f28c18;
}

.btnRojo {
  background:#e3222e;
}

.btnMorado {
  background:#7042d6;
}

.btnCeleste {
  background:#2865e8;
}

.buscarDocente {
  width:100%;
  box-sizing:border-box;
  padding:14px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:14px;
  background:white;
}

@media (max-width:800px) {

  .accionesAdmin {
    grid-template-columns:1fr 1fr;
  }

  .buscarDocente {
    grid-column:1 / -1;
  }

}
 .logo {
  width:180px;
  height:auto;
  display:block;
  margin:30px auto 25px auto;
  object-fit:contain;
}     
</style>
</head>

<body>

  <div class="contenedor">
<img src="./icono-marcaqr.png"
     class="logo"
     alt="MARCAQR">
  <div id="inicioAdmin">

  <button onclick="mostrarLogin()">
    ABRIR MARCAQR ADMIN
  </button>

</div>

<div id="loginAdmin" style="display:none; margin-top:25px;">

  <h2>MARCAQR ADMIN</h2>

  <p>Acceso administrativo</p>

  <input
    id="claveAdmin"
    type="password"
    placeholder="Clave de acceso"
    style="
      width:100%;
      box-sizing:border-box;
      padding:15px;
      border:1px solid #ccc;
      border-radius:10px;
      font-size:17px;
      text-align:center;
      margin:10px 0;
    "
  >

  <button onclick="ingresarAdmin()">
    INGRESAR
  </button>

  <div id="mensajeAdmin"
       style="margin-top:12px;font-weight:bold;"></div>

</div>

<div id="panelAdmin" style="display:none; margin-top:25px;"></div>  

  </div>

  <script>
   function mostrarLogin() {
  document.getElementById("inicioAdmin").style.display = "none";
  document.getElementById("loginAdmin").style.display = "block";
}

function ingresarAdmin() {

  const clave = document
    .getElementById("claveAdmin")
    .value
    .trim();

  const mensaje =
    document.getElementById("mensajeAdmin");

  if (!clave) {
    mensaje.innerHTML = "Ingrese la clave.";
    return;
  }

  mensaje.innerHTML = "Cargando...";

  const callback = "recibirDatosAdmin";

  const script = document.createElement("script");

  script.src =
    "https://script.google.com/macros/s/AKfycbwjzk4Sp5Bw-rQDlYje2y6llUT3skcyek0tu04r3vf5vl-B9QFDXNrb0BrYWC81pfZ5/exec" +
    "?api=admin" +
    "&clave=" + encodeURIComponent(clave) +
    "&callback=" + callback +
    "&t=" + Date.now();

  document.body.appendChild(script);
}

function recibirDatosAdmin(datos) {

  const mensaje =
    document.getElementById("mensajeAdmin");

  if (!datos.ok) {
    mensaje.innerHTML = "❌ Clave incorrecta";
    return;
  }

  document.getElementById("loginAdmin").style.display = "none";

  const panel =
    document.getElementById("panelAdmin");

  panel.style.display = "block";

  let filas = "";

  datos.personal.forEach(p => {

    let color = "#666";

    if (p.estado === "PUNTUAL") {
      color = "#2e7d32";
    }

    if (p.estado === "TARDANZA") {
      color = "#c62828";
    }

    filas += `
      <tr>
        <td>${p.nombre}</td>
        <td>${p.cargo}</td>
        <td>${p.entrada || "--:--"}</td>
        <td>${p.salida || "--:--"}</td>
        <td style="font-weight:bold;color:${color};">
          ${p.estado}
        </td>
      </tr>
    `;
  });

  panel.innerHTML = `

  <div class="cabeceraAdmin">

  <div class="marcaBloque">
    <img src="./icono-marcaqr.png"
         class="logoMarcaAdmin"
         alt="MARCAQR">

    <div class="marcaTexto">MARCA<span>QR</span></div>
    <div class="marcaSlogan">ASISTENCIA • CONTROL • CONFIANZA</div>
  </div>

  <div class="resumenSuperior">

    <div class="kpi kpiAzul">
      <div class="kpiIcono">👥</div>
      <div class="kpiNumero">${datos.presentes}</div>
      <div class="kpiTexto">Presentes</div>
    </div>

    <div class="kpi kpiVerde">
      <div class="kpiIcono">✅</div>
      <div class="kpiNumero">${datos.puntuales}</div>
      <div class="kpiTexto">Puntuales</div>
    </div>

    <div class="kpi kpiNaranja">
      <div class="kpiIcono">🕐</div>
      <div class="kpiNumero">${datos.tardanzas}</div>
      <div class="kpiTexto">Tardanzas</div>
    </div>

    <div class="kpi kpiRojo">
      <div class="kpiIcono">👤</div>
      <div class="kpiNumero">${datos.sinMarcar}</div>
      <div class="kpiTexto">Sin marcar</div>
    </div>

    <div class="kpi kpiMorado">
      <div class="kpiIcono">🚪</div>
      <div class="kpiNumero">${datos.salidas}</div>
      <div class="kpiTexto">Salidas</div>
    </div>

    <div class="datosRapidos">
      <span>📅 <span id="fechaPanel"></span></span>
      <span>🕐 <span id="horaPanel"></span></span>
      <span>👥 Total personal: ${datos.personal.length}</span>
    </div>

  </div>

  <div class="institucionBloque">
    <img src="./logo-ininpe.png"
         class="logoInstitucion"
         alt="ININPE">

    <div class="institucionNombre">${datos.institucion}</div>
    <div class="institucionSub">INSTITUCIÓN EDUCATIVA</div>
  </div>

</div>

<div class="tituloPanel">
  <h2>MARCAQR ADMIN</h2>
  <p>Sistema inteligente de control de asistencia</p>
</div>  

  <div class="accionesAdmin">

  <button class="btnAdmin btnAzul" onclick="location.reload()">
    🔄 ACTUALIZAR
  </button>

  <button class="btnAdmin btnVerde" onclick="mostrarReporteMensual()">
    📊 REPORTE MENSUAL
  </button>

  <button class="btnAdmin btnNaranja" onclick="mostrarTardanzas()">
    🕐 TARDANZAS
  </button>

  <button class="btnAdmin btnRojo" onclick="mostrarFaltas()">
    👤 FALTAS
  </button>

  <button class="btnAdmin btnMorado" onclick="exportarPDF()">
    📄 EXPORTAR PDF
  </button>

  <button class="btnAdmin btnCeleste" onclick="exportarExcel()">
    📊 EXPORTAR EXCEL
  </button>

  <input
    id="buscarDocente"
    class="buscarDocente"
    type="text"
    placeholder="🔍 Buscar docente..."
    oninput="filtrarDocentes()"
  >

</div>  

    <div style="overflow-x:auto;margin-top:20px;">

      <table style="
        width:100%;
        border-collapse:collapse;
        background:white;
        font-size:13px;
      ">

        <thead>
          <tr style="background:#17365D;color:white;">
            <th>DOCENTE</th>
            <th>CARGO</th>
            <th>ENTRADA</th>
            <th>SALIDA</th>
            <th>ESTADO</th>
          </tr>
        </thead>

        <tbody>
          ${filas}
        </tbody>

      </table>

    </div>
  `;
 actualizarFechaHoraPanel();    
}
        
function actualizarFechaHoraPanel() {

  const ahora = new Date();

  const fecha = ahora.toLocaleDateString("es-PE", {
    day: "2-digit",
    month: "long",
    year: "numeric"
  });

  const hora = ahora.toLocaleTimeString("es-PE", {
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit"
  });

  const fechaElemento = document.getElementById("fechaPanel");
  const horaElemento = document.getElementById("horaPanel");

  if (fechaElemento) fechaElemento.textContent = fecha;
  if (horaElemento) horaElemento.textContent = hora;

  setTimeout(actualizarFechaHoraPanel, 1000);
}
 function filtrarDocentes() {

  const texto = document
    .getElementById("buscarDocente")
    .value
    .toLowerCase()
    .trim();

  const filas = document.querySelectorAll("#panelAdmin table tbody tr");

  filas.forEach(fila => {

    const contenido = fila.innerText
      .toLowerCase();

    fila.style.display =
      contenido.includes(texto)
        ? ""
        : "none";
  });
}
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js");
    }
  </script>

</body>
</html>
