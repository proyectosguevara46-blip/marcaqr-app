.resumenSuperior {

grid-template-columns:repeat(5, minmax(105px, 1fr));

.kpi {

.kpiVerde { border-bottom-color:#2eaa45; }
.kpiNaranja { border-bottom-color:#f28c18; }
.kpiRojo { border-bottom-color:#e3222e; }

.datosRapidos {

.btnAzul {

 .logo {

<body>

  <div class="contenedor">
<div id="portadaMarcaqr">        
<img src="./icono-marcaqr.png"
     class="logo"
     alt="MARCAQR">
     <div class="marcaInicio">
  <div class="nombreMarcaInicio">
    MARCA<span>QR</span>
  </div>
</div>
  <div class="sloganMarcaInicio">
    ASISTENCIA • CONTROL • CONFIANZA
  </div>
</div>   
  <div id="inicioAdmin">

  <button onclick="mostrarLogin()">
    ABRIR MARCAQR ADMIN
  </button>

</div>

<div id="loginAdmin" style="display:none; margin-top:25px;">

  <h2>MARCAQR ADMIN</h2>

  <p>Acceso administrativo</p>

  <input
    id="claveAdmin"
    type="password"
    placeholder="Clave de acceso"
    style="
      width:100%;
      box-sizing:border-box;
      padding:15px;
      border:1px solid #ccc;
      border-radius:10px;
      font-size:17px;
      text-align:center;
      margin:10px 0;
    "
  >

  <button onclick="ingresarAdmin()">
    INGRESAR
  </button>

  <div id="mensajeAdmin"
       style="margin-top:12px;font-weight:bold;"></div>

</div>

<div id="panelAdmin" style="display:none; margin-top:25px;"></div>  

  </div>

  <script>
   function mostrarLogin() {
  document.getElementById("inicioAdmin").style.display = "none";
  document.getElementById("loginAdmin").style.display = "block";
}

function ingresarAdmin() {

  const clave = document
    .getElementById("claveAdmin")
    .value
    .trim();

  const mensaje =
    document.getElementById("mensajeAdmin");

  if (!clave) {
    mensaje.innerHTML = "Ingrese la clave.";
    return;
  }

  mensaje.innerHTML = "Cargando...";

  const callback = "recibirDatosAdmin";

  const script = document.createElement("script");

  script.src =
    "https://script.google.com/macros/s/AKfycbwjzk4Sp5Bw-rQDlYje2y6llUT3skcyek0tu04r3vf5vl-B9QFDXNrb0BrYWC81pfZ5/exec" +
    "?api=admin" +
    "&clave=" + encodeURIComponent(clave) +
    "&callback=" + callback +
    "&t=" + Date.now();

  document.body.appendChild(script);
}

function recibirDatosAdmin(datos) {

  const mensaje =
    document.getElementById("mensajeAdmin");

  if (!datos.ok) {
    mensaje.innerHTML = "❌ Clave incorrecta";
    return;
  }

  document.getElementById("loginAdmin").style.display = "none";
document.getElementById("portadaMarcaqr").style.display = "none";
  const panel =
    document.getElementById("panelAdmin");

  panel.style.display = "block";

  let filas = "";

  datos.personal.forEach(p => {

    let color = "#666";

    if (p.estado === "PUNTUAL") {
      color = "#2e7d32";
    }

    if (p.estado === "TARDANZA") {
      color = "#c62828";
    }

    filas += `
      <tr>
        <td>${p.nombre}</td>
        <td>${p.cargo}</td>
        <td>${p.entrada || "--:--"}</td>
        <td>${p.salida || "--:--"}</td>
        <td style="font-weight:bold;color:${color};">
          ${p.estado}
        </td>
      </tr>
    `;
  });

  panel.innerHTML = `

  <div class="cabeceraAdmin">

  <div class="marcaBloque">
    <img src="./icono-marcaqr.png"
         class="logoMarcaAdmin"
         alt="MARCAQR">

    <div class="marcaTexto">MARCA<span>QR</span></div>
    <div class="marcaSlogan">ASISTENCIA • CONTROL • CONFIANZA</div>
  </div>

  <div class="resumenSuperior">

    <div class="kpi kpiAzul">
      <div class="kpiIcono">👥</div>
      <div class="kpiNumero">${datos.presentes}</div>
      <div class="kpiTexto">Presentes</div>
    </div>

    <div class="kpi kpiVerde">
      <div class="kpiIcono">✅</div>
      <div class="kpiNumero">${datos.puntuales}</div>
      <div class="kpiTexto">Puntuales</div>
    </div>

    <div class="kpi kpiNaranja">
      <div class="kpiIcono">🕐</div>
      <div class="kpiNumero">${datos.tardanzas}</div>
      <div class="kpiTexto">Tardanzas</div>
    </div>

    <div class="kpi kpiRojo">
      <div class="kpiIcono">👤</div>
      <div class="kpiNumero">${datos.sinMarcar}</div>
      <div class="kpiTexto">Sin marcar</div>
    </div>

    <div class="kpi kpiMorado">
      <div class="kpiIcono">🚪</div>
      <div class="kpiNumero">${datos.salidas}</div>
      <div class="kpiTexto">Salidas</div>
    </div>

    <div class="datosRapidos">
      <span>📅 <span id="fechaPanel"></span></span>
      <span>🕐 <span id="horaPanel"></span></span>
      <span>👥 Total personal: ${datos.personal.length}</span>
    </div>

  </div>

  <div class="institucionBloque">
    <img src="${datos.logoInstitucion || './logo-ininpe.png'}"
         class="logoInstitucion"
         alt="ININPE">

    <div class="institucionNombre">${datos.institucion}</div>
    <div class="institucionSub">INSTITUCIÓN EDUCATIVA</div>
  </div>

</div> 

  <div class="accionesAdmin">

  <button class="btnAdmin btnAzul" onclick="location.reload()">
    🔄 ACTUALIZAR
  </button>

  <button class="btnAdmin btnVerde" onclick="mostrarReporteMensual()">
    📊 REPORTE MENSUAL
  </button>

  <button class="btnAdmin btnNaranja" onclick="mostrarTardanzas()">
    🕐 TARDANZAS
  </button>

  <button class="btnAdmin btnRojo" onclick="mostrarFaltas()">
    👤 FALTAS
  </button>

  <button class="btnAdmin btnMorado" onclick="exportarPDF()">
    📄 EXPORTAR PDF
  </button>

  <button class="btnAdmin btnCeleste" onclick="exportarExcel()">
    📊 EXPORTAR EXCEL
  </button>

  <input
    id="buscarDocente"
    class="buscarDocente"
    type="text"
    placeholder="🔍 Buscar docente..."
    oninput="filtrarDocentes()"
  >

</div>  
<div id="reporteMensualPanel" style="display:none; margin:20px 0;">

  <div style="
    background:white;
    padding:20px;
    border-radius:14px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
  ">

    <h3 style="margin-top:0;color:#17365D;">
      📊 REPORTE MENSUAL DE ASISTENCIA
    </h3>

    <label style="font-weight:bold;">
      Seleccionar mes:
    </label>

    <input
      type="month"
      id="mesReporte"
      style="
        width:100%;
        box-sizing:border-box;
        padding:12px;
        margin:10px 0 15px 0;
        border:1px solid #ccc;
        border-radius:10px;
        font-size:16px;
      "
    >

    <button
      class="btnAdmin btnVerde"
      onclick="cargarReporteMensual()">
      📊 CONSULTAR REPORTE
    </button>

    <div id="resultadoReporteMensual"
         style="margin-top:20px;">
    </div>

  </div>

</div>
<div id="tardanzasPanel" style="display:none; margin:20px 0;">

  <div style="
    background:white;
    padding:20px;
    border-radius:14px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
  ">

    <h3 style="margin-top:0;color:#f28c18;">
      🕐 REPORTE DE TARDANZAS
    </h3>

    <label style="font-weight:bold;">
      Seleccionar mes:
    </label>

    <input
      type="month"
      id="mesTardanzas"
      style="
        width:100%;
        box-sizing:border-box;
        padding:12px;
        margin:10px 0 15px 0;
        border:1px solid #ccc;
        border-radius:10px;
        font-size:16px;
      "
    >

    <button
      class="btnAdmin btnNaranja"
      onclick="cargarTardanzas()">
      🕐 CONSULTAR TARDANZAS
    </button>

    <div id="resultadoTardanzas"
         style="margin-top:20px;">
    </div>

  </div>

</div>
<div id="faltasPanel" style="display:none; margin:20px 0;">

  <div style="
    background:white;
    padding:20px;
    border-radius:14px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
  ">

    <h3 style="margin-top:0;color:#e3222e;">
      👤 REPORTE DE FALTAS
    </h3>

    <label style="font-weight:bold;">
      Seleccionar mes:
    </label>

    <input
      type="month"
      id="mesFaltas"
      style="
        width:100%;
        box-sizing:border-box;
        padding:12px;
        margin:10px 0 15px 0;
        border:1px solid #ccc;
        border-radius:10px;
        font-size:16px;
      "
    >

    <button
      class="btnAdmin btnRojo"
      onclick="cargarFaltas()">
      👤 CONSULTAR FALTAS
    </button>

    <div id="resultadoFaltas"
         style="margin-top:20px;">
    </div>

  </div>

</div>
    <div style="overflow-x:auto;margin-top:20px;">

      <table style="
        width:100%;
        border-collapse:collapse;
        background:white;
        font-size:13px;
      ">

        <thead>
          <tr style="background:#17365D;color:white;">
            <th>DOCENTE</th>
            <th>CARGO</th>
            <th>ENTRADA</th>
            <th>SALIDA</th>
            <th>ESTADO</th>
          </tr>
        </thead>

        <tbody>
          ${filas}
        </tbody>

      </table>

    </div>
    
  `;
 actualizarFechaHoraPanel();    
}
        
function actualizarFechaHoraPanel() {

  const ahora = new Date();

  const fecha = ahora.toLocaleDateString("es-PE", {
    day: "2-digit",
    month: "long",
    year: "numeric"
  });

  const hora = ahora.toLocaleTimeString("es-PE", {
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit"
  });

  const fechaElemento = document.getElementById("fechaPanel");
  const horaElemento = document.getElementById("horaPanel");

  if (fechaElemento) fechaElemento.textContent = fecha;
  if (horaElemento) horaElemento.textContent = hora;

  setTimeout(actualizarFechaHoraPanel, 1000);
}
 function filtrarDocentes() {

  const texto = document
    .getElementById("buscarDocente")
    .value
    .toLowerCase()
    .trim();

  const filas = document.querySelectorAll("#panelAdmin table tbody tr");

  filas.forEach(fila => {

    const contenido = fila.innerText
      .toLowerCase();

    fila.style.display =
      contenido.includes(texto)
        ? ""
        : "none";
  });
}
 function mostrarReporteMensual() {
    const panel = document.getElementById("reporteMensualPanel");

    if (!panel) return;

    if (panel.style.display === "none" || panel.style.display === "") {
        panel.style.display = "block";
    } else {
        panel.style.display = "none";
    }
}   
  function cargarReporteMensual() {

  const mes = document
    .getElementById("mesReporte")
    .value;

  const resultado =
    document.getElementById("resultadoReporteMensual");

  if (!mes) {
    resultado.innerHTML = "Seleccione un mes.";
    return;
  }

  resultado.innerHTML = "Cargando reporte...";

  const clave = document
    .getElementById("claveAdmin")
    .value
    .trim();

  const callback =
    "recibirReporteMensual";

  const script =
    document.createElement("script");

  script.src =
    "https://script.google.com/macros/s/AKfycbwjzk4Sp5Bw-rQDlYje2y6llUT3skcyek0tu04r3vf5vl-B9QFDXNrb0BrYWC81pfZ5/exec" +
    "?api=reporteMensual" +
    "&clave=" + encodeURIComponent(clave) +
    "&mes=" + encodeURIComponent(mes) +
    "&callback=" + callback +
    "&t=" + Date.now();

  document.body.appendChild(script);
}
let ultimoReporteMensual = null;
function recibirReporteMensual(datos) {

  const resultado =
    document.getElementById("resultadoReporteMensual");

  if (!datos.ok) {
    resultado.innerHTML =
      "❌ " + datos.mensaje;
    return;
  }
ultimoReporteMensual = datos;
  let filas = "";

  datos.personal.forEach(p => {

    filas += `
      <tr>
        <td>${p.nombre}</td>
        <td>${p.asistencias}</td>
        <td>${p.puntuales}</td>
        <td>${p.tardanzas}</td>
        <td>${p.faltas}</td>
        <td>${p.porcentaje}%</td>
      </tr>
    `;
  });

  resultado.innerHTML = `
    <div style="overflow-x:auto;">

      <table style="
        width:100%;
        border-collapse:collapse;
        background:white;
        margin-top:10px;
      ">

        <thead>
          <tr style="
            background:#17365D;
            color:white;
          ">
            <th>DOCENTE</th>
            <th>ASISTENCIAS</th>
            <th>PUNTUALES</th>
            <th>TARDANZAS</th>
            <th>FALTAS</th>
            <th>% ASISTENCIA</th>
          </tr>
        </thead>

        <tbody>
          ${filas}
        </tbody>

      </table>

    </div>
  `;
}   
 function mostrarTardanzas() {

  const panel =
    document.getElementById("tardanzasPanel");

  if (!panel) return;

function recibirTardanzas(datos) {

  const resultado =
    document.getElementById("resultadoTardanzas");

  if (!datos.ok) {
    resultado.innerHTML =
      "❌ " + datos.mensaje;
    return;
  }

  if (!datos.tardanzas.length) {
    resultado.innerHTML =
      "✅ No se registraron tardanzas en este mes.";
    return;
  }

  let filas = "";

  datos.tardanzas.forEach(t => {

    filas += `
      <tr>
        <td>${t.fecha}</td>
        <td>${t.nombre}</td>
        <td>${t.cargo}</td>
        <td>${t.horaProgramada || "--:--"}</td>
        <td>${t.horaEntrada || "--:--"}</td>

    `;
  });

  resultado.innerHTML = `

        width:100%;

      </table>

 function exportarExcel() {

  }

    "FALTAS": p.faltas,
    "% ASISTENCIA": p.porcentaje + "%"
  }));

  const hoja = XLSX.utils.json_to_sheet(datosExcel);

  hoja["!cols"] = [
    { wch: 32 },
    { wch: 28 },
    { wch: 14 },
    { wch: 14 },
    { wch: 14 },
    { wch: 12 },
    { wch: 16 }
  ];

  const libro = XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(
    libro,
    hoja,
    "Reporte mensual"
  );

  XLSX.writeFile(
    libro,
    "MARCAQR_Reporte_" + mes + ".xlsx"
  );
